function render(){
  Array.prototype.forEach.call($("days").children,function(b){b.className=b.getAttribute("data-d")===day?"on":""});
  var cur=cells(venue,day,hr),nb=nextBusy(venue,day,hr),html="";
  if(cur.length){var end=Math.max.apply(null,cur.map(function(c){return c[1]}));
    html+='<div class="stat busy">Occupied</div><div class="mu">'+venue+', '+day+' '+f(hr)+'. '+cur.map(function(c){return c[3]+' ('+c[2]+')'}).join(", ")+'. Free from '+f(end)+(cells(venue,day,end).length?' (back-to-back, check the grid)':'')+'.</div>'}
  else{html+='<div class="stat free">Free</div><div class="mu">'+venue+', '+day+' '+f(hr)+'. '+(nb===null?'Nothing else scheduled today.':'Next class at '+f(nb)+'.')+'</div>'}
  html+='<div style="margin-top:8px">';
  for(var h=7;h<=19;h++){var c=cells(venue,day,h),cls=c.length?"b":"f",isNow=(isWk&&DAYS[dow-1]===day&&now.getHours()===h);
    html+='<div class="slot '+cls+(h===hr?' now':'')+'"><span class="t">'+f(h)+'-'+e(h)+'</span><span>'+(c.length?c.map(function(x){return x[3]+' <span class="mu">'+x[2]+'</span>'}).join(" + "):'free')+(isNow?' <b class="mu">(now)</b>':'')+'</span></div>'}
  $("main").innerHTML=html+'</div>';
  var fl=Object.keys(DATA).sort().filter(function(v){return !cells(v,day,hr).length});
  $("fl-sub").textContent=day+' '+f(hr)+'-'+e(hr)+': '+fl.length+' of '+Object.keys(DATA).length+' venues free. Tap one to open it.';
  $("freelist").innerHTML=fl.map(function(v){return '<button class="pill" data-v="'+v+'">'+v+'</button>'}).join("");
}
init();
document.addEventListener("visibilitychange",function(){if(!document.hidden){syncNow();$("hour").value=hr;render()}});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script></body></html>
